<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title description">
  <title id="title">Flamm</title>
  <desc id="description">Fold space. Forward ports.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2230" />
      <stop offset="1" stop-color="#07131c" />
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbfa" />
      <stop offset="1" stop-color="#a8c9c8" />
    </linearGradient>
    <linearGradient id="throat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff725e" />
      <stop offset="1" stop-color="#ffad66" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".34" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#d8eeee" stroke-opacity=".035" />
    </pattern>
  </defs>

  <rect width="1600" height="560" rx="36" fill="url(#background)" />
  <rect width="1600" height="560" rx="36" fill="url(#grid)" />
  <circle cx="1510" cy="-40" r="300" fill="#ff8064" opacity=".07" />
  <circle cx="60" cy="590" r="270" fill="#79bebe" opacity=".06" />

  <g transform="translate(130 105) scale(.35)" filter="url(#shadow)">
    <rect width="1024" height="1024" rx="224" fill="#0a1923" stroke="#d8eeee" stroke-opacity=".12" stroke-width="8" />
    <path d="M180 238c90 0 181 28 245 76 42 31 71 68 87 106 16-38 45-75 87-106 64-48 155-76 245-76v100c-70 0-134 19-179 53-42 31-65 73-65 121H424c0-48-23-90-65-121-45-34-109-53-179-53Z" fill="url(#surface)" />
    <path d="M180 786c90 0 181-28 245-76 42-31 71-68 87-106 16 38 45 75 87 106 64 48 155 76 245 76V686c-70 0-134-19-179-53-42-31-65-73-65-121H424c0 48-23 90-65 121-45 34-109 53-179 53Z" fill="url(#surface)" />
    <rect x="422" y="474" width="180" height="76" rx="38" fill="url(#throat)" />
  </g>

  <g transform="translate(570 0)">
    <text x="0" y="249" fill="#f8fbfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="112" font-weight="760" letter-spacing="-5">Flamm</text>
    <text x="3" y="326" fill="#ff8b68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="680" letter-spacing="2">FOLD SPACE. FORWARD PORTS.</text>
    <text x="3" y="386" fill="#b9cecf" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="430">Native SSH tunnels, one click from the menu bar.</text>
  </g>

  <g transform="translate(1370 246)" fill="none" stroke="#ff8b68" stroke-linecap="round" stroke-width="11">
    <path d="M0 35h34c20 0 30-16 45-35 15 19 25 35 45 35h34" opacity=".58" />
    <path d="M0 75h34c20 0 30 16 45 35 15-19 25-35 45-35h34" opacity=".9" />
  </g>
</svg>
